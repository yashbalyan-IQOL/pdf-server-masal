<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Evaluation of Project's Surroundings</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
    href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&family=Montserrat:wght@400;500;600;700&family=Lato:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  /><style>
      @page {
        size: 1920px 1080px;
        margin: 0;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Montserrat', sans-serif;
      }

      html, body {
        width: 1920px;
        height: 1080px;
        margin: 0;
        padding: 0;
        overflow: auto;
      }

      body {
        padding: 60px;
        background-color: #f5f5f5;
        background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M11 18c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm48 25c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm-43-7c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm63 31c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM34 90c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm56-76c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM12 86c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm28-65c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm23-11c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-6 60c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm29 22c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zM32 63c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm57-13c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-9-21c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM60 91c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM35 41c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM12 60c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2z' fill='%23bdbdbd' fill-opacity='0.1' fill-rule='evenodd'/%3E%3C/svg%3E");
        position: relative;
      }

      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 40px;
      }

      h1 {
        font-size: 72px;
        color: #000;
        font-family: 'Lora', serif;
        margin-bottom: 40px;
        font-weight: bold;
      }

      .whatsapp-banner {
        display: flex;
        align-items: center;
        font-size: 28px;
      }

      .whatsapp-icon {
        
        width: 45px;
        height: 45px;
        display: flex;
        justify-content: center;
        align-items: center;
        margin-right: 10px;
      }

      .link {
        font-size: 28px;
        color: #148880;
        text-decoration: none;
        font-weight: 500;
        margin-left: 10px;
      }

      .content-container {
        display: flex;
        justify-content: space-between;
        gap: 50px;
      }

      .evaluation-table {
        width: 70%;
        border-collapse: collapse;
      }

      .evaluation-table th, 
      .evaluation-table td {
        padding: 20px 10px;
        text-align: left;
        border-bottom: 2px solid #B9B9B9;
        font-size: 24px;
        height: 100px;
        vertical-align: middle;
      }

      .evaluation-table th {
        font-weight: 600;
        text-align: center;
        color: black;
      }
      .evaluation-table th:first-child {
        text-align: left;
      }

      
      .evaluation-table td {
        font-family: 'Lato', sans-serif;
        text-align: center;
      }

      .evaluation-table tr td:first-child {
        text-align: left;
        width: 30%;
        font-weight: 600;
        font-family: 'Montserrat', sans-serif;
      }

      /* Improved impact indicator styling */
      .impact-column {
        width: 250px;
      }

      .evaluation-result {
        height: 100%;
        font-weight: 600;
        padding: 0;
        color: black;
        font-size: 28px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
      }

      .impact-indicator {
        position: relative;
        width: 150px;
        height: 8px;
        border-radius: 4px;
        overflow: visible;
        margin: 0;
      }

      .impact-level {
        position: absolute;
        top: 0;
        left: 0;
        bottom: 0;
        width: 100%;
        display: flex;
      }

      .impact-red {
        flex: 1;
        background: linear-gradient(to right, #ff6b6b, #ff9999);
        border-top-left-radius: 4px;
        border-bottom-left-radius: 4px;
      }

      .impact-yellow {
        flex: 1;
        background: linear-gradient(to right, #ffe066, #ffd166);
      }

      .impact-green {
        flex: 1;
        background: linear-gradient(to right, #8fffdf, #06d6a0);
        border-top-right-radius: 4px;
        border-bottom-right-radius: 4px;
      }

      .impact-marker {
        position: absolute;
        width: 4px;
        height: 16px;
        background-color: #000;
        border-radius: 2px;
        top: -4px;
        right: 10px;
        transform: translateX(-50%);
      }

      /* Added missing impact marker positioning */
      .impact-marker.low {
        left: 16.67%;
        right: auto;
      }

      .impact-marker.medium {
        left: 50%;
        right: auto;
      }

      .impact-marker.high {
        left: 83.33%;
        right: auto;
      }

      .gauge-labels {
        position: absolute;
        width: 100%;
        top: 15px;
        left: 0;
        display: flex;
        justify-content: space-between;
        font-size: 12px;
        color: #666;
      }

      .gauge-label-left {
        margin-left: -5px;
      }

      .gauge-label-right {
        margin-right: -5px;
      }

      .project-image {
        width: 456px;
        height: 783px;
        border-radius: 30px;
        overflow: hidden;
        position: relative;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
      }

      .project-image img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .yellow-corner {
        position: absolute;
        bottom: 0;
        right: 0;
        width: 200px;
        height: 200px;
        background-color: #FFC107;
        border-top-left-radius: 100%;
        z-index: -1;
      }

      .yellow-circle {
        position: absolute;
        left: 0;
        top: 0;
        width: 250px;
        height: 250px;
        background-color: rgba(255, 193, 7, 0.2);
        border-radius: 50%;
        z-index: -1;
      }

      .star-decoration {
        position: absolute;
        top: 20px;
        right: 20px;
        font-size: 60px;
        color: #FFB74D;
      }

      .estate-score {
        position: absolute;
        top: 80px;
        right: 80px;
        width: 120px;
        height: 120px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        color: white;
        z-index: 10;
      }
      .estate-score img{
        width: 120px;
        height: 120px;
        justify-content: center;
        align-items: center;
       
      }

      .estate-score::before {
        content: "";
        position: absolute;
        top: -8px;
        left: -8px;
        right: -8px;
        bottom: -8px;
        
        border-radius: 50%;
        z-index: -1;
      }

      .score-value {
        justify-content: center;
        align-items: center;
        position: absolute;
        font-size: 36px;
        font-weight: bold;
        line-height: 1;
      }
      .score-text {
        font-size: 14px;
        text-align: center;
        margin-top: 4px;
      }

      .score-label {
        position: absolute;
        width: 200%;
        top: -10px;
        left: -50%;
        text-align: center;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 1px;
      }
      
    </style>
  </head>
  <body>
    <div class="star-decoration">★</div>
    <div class="yellow-circle"></div>
    
    <div class="header">
      <h1>Project - Area Review</h1>
      <div class="estate-score">
     
        <div class="score-value">{{TRUEESTATE_SCORE}}<span style="font-size: 20px">/10</span></div>
        
        <img src="../assets/logos/impactScore.png" alt="impact logo" height="120px" width="120px">
      </div>
    </div>

    <div class="content-container">
      <table class="evaluation-table">
        <tr>
          <th>Factor</th>
          <th>Current Status</th>
          <th>Reference Avg.</th>
          <th>Evaluation</th>
        </tr>
        {{{TABLE_ROWS_HTML}}}
      </table>


      <div class="project-image">
        <img src="../assets/images/evalutionplaceholder.png" alt="Project Aerial View" height="45px" width="45px">
       
      </div>
    </div>
    
    <div class="yellow-corner"></div>

  </body>
</html>
