<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bengaluru Area-Wise Pricing</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
  href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&family=Montserrat:wght@400;500;600;700&family=Lato:wght@400;500;600;700&display=swap"
  rel="stylesheet"
/>
<style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Montserrat', sans-serif;
    }
    
    @page {
      size: 1920px 1080px;
      margin: 0;
    }
    
    html, body {
      width: 1920px;
      height: 1080px;
      margin: 0;
      padding: 0;
      overflow: auto;
      background-color: #f5f5f5;
      background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M11 18c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm48 25c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm-43-7c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm63 31c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM34 90c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm56-76c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM12 86c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm28-65c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm23-11c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-6 60c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm29 22c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zM32 63c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm57-13c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-9-21c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM60 91c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM35 41c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM12 60c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2z' fill='%23bdbdbd' fill-opacity='0.1' fill-rule='evenodd'/%3E%3C/svg%3E");
      color: #333;
      line-height: 1.6;
      position: relative;
    }
    
    .container {
      width: 100%;
      height: 100%;
      padding: 80px;
      position: relative;
    }
    
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 60px;
    }
    
    h1 {
      font-size: 72px;
      color: #000;
      font-weight: bold;
      font-family: 'Lora', serif;
    }
    
    .content {
      display: flex;
      gap: 80px;
      height: calc(100% - 140px);
    }
    
    .map-section {
      width: 40%;
      height: 100%;
    }
    
    .map-container {
      width: 100%;
      height: 100%;
      position: relative;
      border-radius: 20px;
      overflow: hidden;
      
    }
    
    .map-image {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    
    .info-section {
      width: 50%;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      padding: 40px 0;
    }
    
    .bullet-points {
      margin-top: 60px;
      font-size: 36px;
      font-family: 'Lato', 'sans-serif';
      font-weight: 400;
    }
    
    .bullet-point {
      display: flex;
      color: #2B2928;
      align-items: flex-start;
      margin-bottom: 60px;
      font-family: 'Lato', 'sans-serif';
    }
    
    .bullet-point-dot {
      min-width: 16px;
      height: 16px;
      background-color: black;
      border-radius: 50%;
      margin-top: 16px;
      margin-right: 25px;
    }
    
    .highlight {
      font-weight: 700;
      color: black;
    }
    
    .legend {
      display: flex;
      margin-top: 50px;
      justify-content: flex-start;
      gap: 60px;
    }
    
    .legend-item {
      display: flex;
      align-items: center;
      font-size: 24px;
    }
    
    .legend-icon {
      width: 30px;
      height: 30px;
      margin-right: 15px;
    }
    
    .commercial-icon {
      background-color: #0a3190;
      border-radius: 50%;
    }
    
    .price-icon {
      background-color: #b30000;
      color: white;
      text-align: center;
      font-size: 16px;
      line-height: 30px;
    }
    
    .legend-text {
      font-size: 24px;
    }
    
    .decoration-bottom-right {
      position: absolute;
      bottom: -150px;
      right: -150px;
      width: 500px;
      height: 500px;
      z-index: -1;
    }
    
    .yellow-circle {
      position: absolute;
      left: 0;
      top: 0;
      width: 250px;
      height: 250px;
      background-color: rgba(255, 193, 7, 0.2);
      border-radius: 50%;
      z-index: -1;
    }
    
    .star-decoration {
      position: absolute;
      top: 100px;
      right: 400px;
      font-size: 70px;
      color: #F0A830;
      transform: rotate(20deg);
    }
    
    .back-to-top {
      position: fixed;
      bottom: 80px;
      right: 80px;
      height: 72px;
      width: 72px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      z-index: 100;
    }
    
    .back-to-top img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
</head>
<body>
  <div class="yellow-circle"></div>
  <div class="star-decoration">★</div>
  
  <div class="container">
    <div class="header">
      <h1>Current Prices - ORR and Airport Road</h1>
    </div>
    
    <div class="content">
      <div class="map-section">
        <div class="map-container">
          <img src="../assets/images/PriceMap.png" alt="Bengaluru Area Map with Pricing" class="map-image">
        </div>
      </div>
      
      <div class="info-section">
       
        
        <div class="bullet-points">
          <div class="bullet-point">
            <div class="bullet-point-dot"></div>
            <div>
              Most major commercial developments are coming up along the <span class="highlight">Outer Ring Road</span> and <span class="highlight">Airport Road</span> (from Silk Board to the airport).
            </div>
          </div>
          
          <div class="bullet-point">
            <div class="bullet-point-dot"></div>
            <div>
              <span class="highlight">Residential areas</span> near the airport have much higher potential for <span class="highlight">price appreciation</span> compared to areas in HSR, Koramangala, etc.
            </div>
          </div>
        </div>
      </div>
    </div>
    
    <img src="../assets/icons/bottomlogo.png" alt="" class="decoration-bottom-right">
  </div>
  
  <div class="back-to-top">
    <img src="../assets/logos/truestate.png" alt="TruEstate Logo" style="width: 100%; height: 100%; object-fit: contain;">
  </div>
</body>
</html>
