<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Unit Level - Real Estate Information</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      @page {
        size: 1920px 1080px;
        margin: 0;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Lora', serif;
      }

      html, body {
        width: 1920px;
        height: 1080px;
        margin: 0;
        padding: 0;
        overflow: auto;
      }

      body {
        padding: 80px;
        background-color: #f5f5f5;
        background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M11 18c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm48 25c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm-43-7c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm63 31c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM34 90c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm56-76c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM12 86c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm28-65c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm23-11c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-6 60c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm29 22c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zM32 63c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm57-13c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-9-21c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM60 91c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM35 41c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM12 60c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2z' fill='%23bdbdbd' fill-opacity='0.1' fill-rule='evenodd'/%3E%3C/svg%3E");
      }

      .container {
        display: flex;
        gap: 0px;
        flex-direction: column;
        height: 100%;
        width: 100%;
        position: relative;
      }

      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 40px;
      }

      h1 {
        font-size: 72px;
        margin-bottom: 40px;
        color: #222;
      }

      .content {
        display: flex;
        justify-content: space-between;
        gap: 200px;
        height: calc(100% - 160px);
      }

      .left-section {
        flex: 4;
        position: relative;
        height: 100%;
      }

      .image-container {
        width: 100%;
        height: 780px;
        border-radius: 12px;
        overflow: hidden;
        position: relative;
      }

      .property-image {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 12px;
      }

      .orange-curve {
        position: absolute;
        bottom: -80px;
        left: -80px;
        width: 300px;
        height: 300px;
        background-color: #ff8a00;
        border-radius: 50%;
        z-index: -1;
      }

      .orange-curve::before {
        content: "";
        position: absolute;
        top: -80px;
        right: -120px;
        width: 100px;
        height: 100px;
        background-color: #DD8107;
        clip-path: polygon(
          50% 0%,
          61% 35%,
          98% 35%,
          68% 57%,
          79% 91%,
          50% 70%,
          21% 91%,
          32% 57%,
          2% 35%,
          39% 35%
        );
      }

      .right-section {
        flex: 6;
        height: 100%;
        overflow: hidden;
      }

      .info-table {
        width: 100%;
        height: 100%;
        border-collapse: collapse;
        font-family: 'Montserrat', sans-serif;
      }

      .info-table tr {
        border-bottom: 2px solid #B9B9B9;
      }

      .info-table tr:last-child {
        border-bottom: none;
      }

      .info-table th,
      .info-table td {
        padding: 18px 10px;
        text-align: center;
      }

      .info-table th:first-child,
      .info-table td:first-child {
        text-align: center;
        font-weight: bold;
      }

      .info-table th {
        font-size: 24px;
        color: #000000;
        font-weight: 600;
      }

      .info-table td {
        font-size: 24px;
        font-weight: 500;
      }

      .score-row {
        background-color: #ffe1bf;
      }

      .whatsapp-banner {
        position: absolute;
        right: 80px;
        display: flex;
        align-items: center;
        font-size: 28px;
        font-family: 'Lato', sans-serif;
      }

      .link {
        font-size: 28px;
        color: #148880;
        text-decoration: none;
        font-weight: 500;
      }
      .star-logo {
        position: absolute;
        bottom: 100px;
        left: 580px;
        width: 100px;
        height: 100px;
        z-index: 100;
      }
      .impact-logo {
        position: absolute;
        top: 0px;
        left: 0px;
        width: 130px;
        height: 130px;
        z-index: 100;
      }
      .disclaimer {
        position: absolute;
        text-align: center;
        font-size: 20px;
        color: white;
        bottom: 0px;
        left: 0px;
        width: 100%;
        height: 100px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <div class="whatsapp-banner">
          
            <img
              src="../assets/logos/whatsapp.png"
              alt="WhatsApp"
              height="40"
              width="40"
            />
        
          <span>Want to invest? <a href="#" class="link">Click here</a></span>
        </div>
        <h1>Project Plan - Unit Level</h1>
      </div>

      <div class="content">
        <div class="left-section">
          <div class="image-container">
            <img
              src="../assets/images/unitLevel.png"
              alt="Modern bedroom with platform bed"
              class="property-image"
            />
          </div>
          <div class="orange-curve"></div>
          <img
            src="../assets/icons/starLogo.png"
            alt="Modern bedroom with platform bed"
            class="star-logo"
          />
          <img src="../assets/icons/imactLogo.png" alt="Impact Logo" class="impact-logo" height="100px" width="100px"/>
          <div class="disclaimer">*This image is not real, it is just for presentation purposes.</div>
        </div>

        <div class="right-section">
          <table class="info-table">
            <thead>
              <tr>
                <th>Parameter</th>
                {{#each CONFIGURATIONS}}
                <th>{{this}}</th>
                {{/each}}
              </tr>
            </thead>
            <tbody>
              {{#each TABLE_DATA}}
              <tr{{#if this.isScore}} class="score-row"{{/if}}>
                <td>{{this.label}}</td>
                {{#each ../PROCESSED_CONFIGS}}
                <td>{{lookup this ../key}}</td>
                {{/each}}
              </tr>
              {{/each}}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </body>
</html>
