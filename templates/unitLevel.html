<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Unit Level - Real Estate Information</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
    href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&family=Montserrat:wght@400;500;600;700&family=Lato:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <style>
      @page {
        size: 1920px 1080px;
        margin: 0;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Lora', serif;
      }

      html, body {
        width: 1920px;
        height: 1080px;
        margin: 0;
        padding: 0;
        overflow: auto;
      }

      body {
        padding: 80px;
        background-color: #f5f5f5;
        background-image: url('../assets/bgImage.png');
      }

      .container {
        display: flex;
        gap: 0px;
        flex-direction: column;
        height: 100%;
        width: 100%;
        position: relative;
      }

      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 40px;
      }

      h1 {
        font-size: 72px;
        margin-bottom: 40px;
        color: #222;
      }

      .content {
        display: flex;
        justify-content: space-between;
        gap: 200px;
        height: calc(100% - 160px);
      }

      .left-section {
        flex: 4;
        position: relative;
        height: 100%;
      }

      .image-container {
        width: 100%;
        height: 780px;
        border-radius: 12px;
        overflow: hidden;
        position: relative;
      }

      .property-image {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 12px;
      }

      .orange-curve {
        position: absolute;
        bottom: -80px;
        left: -80px;
        width: 300px;
        height: 300px;
        background-color: #ff8a00;
        border-radius: 50%;
        z-index: -1;
      }

      .orange-curve::before {
        content: "";
        position: absolute;
        top: -80px;
        right: -120px;
        width: 100px;
        height: 100px;
        background-color: #DD8107;
        clip-path: polygon(
          50% 0%,
          61% 35%,
          98% 35%,
          68% 57%,
          79% 91%,
          50% 70%,
          21% 91%,
          32% 57%,
          2% 35%,
          39% 35%
        );
      }

      .right-section {
        flex: 6;
        height: 100%;
        overflow: hidden;
      }

      .info-table {
        width: 100%;
        height: 100%;
        border-collapse: collapse;
        font-family: 'Lato', sans-serif;
      }

      .info-table tr {
        border-bottom: 2px solid #B9B9B9;
      }

      .info-table tr:last-child {
        border-bottom: none;
      }
      .info-table th
       {
       font-family: 'Montserrat', sans-serif;
        
      }

      .info-table th,
      .info-table td {
        padding: 18px 10px;
        text-align: center;
        
      }

      .info-table th:first-child,
      .info-table td:first-child {
        text-align: center;
        font-weight: bold;
        font-family: 'Montserrat', sans-serif;
      }

      .info-table th {
        font-size: 24px;
        color: #000000;
        font-weight: 600;
      }

      .info-table td {
        font-size: 24px;
        font-weight: 500;
        font-family: 'Lato';
      }

      .score-row {
        background-color: #ffe1bf;
      }

      .whatsapp-banner {
        position: absolute;
        right: 80px;
        display: flex;
        align-items: center;
        font-size: 28px;
        font-family: 'Lato', sans-serif;
      }

      .link {
        font-size: 28px;
        color: #148880;
        text-decoration: none;
        font-weight: 500;
      }
      .star-logo {
        position: absolute;
        bottom: 100px;
        left: 580px;
        width: 100px;
        height: 100px;
        z-index: 100;
      }
      .impact-logo {
        position: absolute;
        top: 0px;
        left: 0px;
        width: 130px;
        height: 130px;
        z-index: 100;
      }
      .disclaimer {
        position: absolute;
        text-align: center;
        font-size: 20px;
        color: white;
        bottom: -80px;
        left: 0px;
        width: 100%;
        height: 100px;
      }
      .back-to-top {
        position: fixed;
        bottom: 30px;
        right: 30px;
        width: 60px;
        height: 60px;
        
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        cursor: pointer;
        z-index: 100;
      }

      .back-to-top img {
        width: 60px;
        height: 60px;
        fill: white;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>Project Plan - Unit Level</h1>
      </div>

      <div class="content">
        <div class="left-section">
          <div class="image-container">
            <img
              src="../assets/images/unitLevel.png"
              alt="Modern bedroom with platform bed"
              class="property-image"
            />
          </div>
          <div class="orange-curve"></div>
          <img
            src="../assets/icons/starLogo.png"
            alt="Modern bedroom with platform bed"
            class="star-logo"
          />
          <!-- <img src="../assets/icons/imactLogo.png" alt="Impact Logo" class="impact-logo" height="100px" width="100px"/> -->
          <div class="disclaimer">*This image is not real, it is just for presentation purposes.</div>
        </div>

        <div class="right-section">
          <table class="info-table">
            <thead>
              <tr>
                <th>Parameter</th>
                {{#each CONFIGURATIONS}}
                <th>{{this}}</th>
                {{/each}}
              </tr>
            </thead>
            <tbody>
              {{#each TABLE_DATA}}
              <tr{{#if this.isScore}} class="score-row"{{/if}}>
                <td>{{this.label}}</td>
                {{#each ../PROCESSED_CONFIGS}}
                <td>{{lookup this ../key}}</td>
                {{/each}}
              </tr>
              {{/each}}
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <div class="back-to-top">
      <img src="../assets/logos/truestate.png" alt="truestate logo" height="30px" width="30px">
    </div>
  </body>
</html>
