    <meta charset="UTF-8" />

    <title>TruEstate Investment Report</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body,
      html {
        height: 100%;
        font-family: Arial, sans-serif;
        color: white;
        background-color: #004642;
      }

      .report-container {
        width: 100%;
        height: 100%;
        position: relative;
        overflow: hidden;
      }

      .bg-image {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: #004642;
        z-index: 1;
      }

      .content-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 2;
        padding: 50px;
      }

      /* Header removed and replaced with direct logo positioning */

      .logo {
        display: flex;
        align-items: center;
        margin-bottom: 200px;
      }

      .logo-icon {
        margin-right: 15px;
      }

      .logo-text {
        font-size: 32px;
        font-weight: bold;
      }

      .date {
        font-size: 20px;
        position: absolute;
        top: 50px;
        right: 50px;
      }

      .report-info {
        max-width: 50%;
      }

      .label {
        font-size: 28px;
        margin-bottom: 20px;
      }

      .project-name {
        font-size: 58px;
        font-weight: bold;
        line-height: 1.1;
      }

      .blueprint-overlay {
        position: absolute;
        top: 0;
        right: 0;
        width: 100%;
        height: 100%;
        background-image: url('../assets/icons/image.png');
       background-repeat: no-repeat;
        background-position: right center;
        background-size: 60%;
        opacity: 0.2;
        z-index: 1;
      }

      /* Divider removed as requested */
    </style>
  </head>
