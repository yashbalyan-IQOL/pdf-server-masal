<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Real Estate Investment Report</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #2c3e50;
        font-family: 'Arial', sans-serif;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
      }
      .container {
        width: 90%;
        height: 90%;
        display: flex;
        flex-direction: column;
        position: relative;
        overflow: hidden;
      }
      .blueprint-bg {
        position: absolute;
        bottom: 0;
        right: 0;
        width: 70%;
        height: 70%;
        opacity: 0.15;
        z-index: 1;
        background-image: url('../assets/blueprint.png');
        background-size: contain;
        background-position: bottom right;
        background-repeat: no-repeat;
        border: 1px solid rgba(255,255,255,0.1);
        /* Fallback design if image is not available */
        background-color: rgba(0,0,0,0.2);
        background-image: linear-gradient(rgba(255,255,255,0.1) 1px, transparent 1px),
                          linear-gradient(90deg, rgba(255,255,255,0.1) 1px, transparent 1px);
        background-size: 20px 20px, 20px 20px;
      }
      .content {
        z-index: 2;
        position: relative;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 50px;
      }
      .logo {
        font-size: 18px;
        letter-spacing: 2px;
        text-transform: uppercase;
        margin-bottom: 80px;
        padding-bottom: 10px;
        border-bottom: 1px solid rgba(255,255,255,0.3);
        width: fit-content;
      }
      .title-section {
        margin-bottom: 50px;
      }
      .label {
        color: #3498db;
        font-size: 18px;
        margin-bottom: 15px;
        font-weight: 500;
      }
      .title {
        font-size: 54px;
        font-weight: bold;
        text-transform: uppercase;
        margin-bottom: 20px;
        line-height: 1.2;
      }
      .subtitle {
        font-size: 28px;
        opacity: 0.8;
        margin-bottom: 15px;
        font-weight: 300;
        color: #3498db;
      }
      .project {
        font-size: 52px;
        font-weight: 700;
        margin-bottom: 25px;
        line-height: 1.2;
        text-transform: capitalize;
        color: #fff;
        border-left: 5px solid #3498db;
        padding-left: 20px;
      }
      .date {
        font-size: 18px;
        font-weight: light;
        margin-top: 8px;
        color: rgba(255,255,255,0.7);
      }
      .footer {
        margin-top: auto;
        font-size: 14px;
        opacity: 0.7;
        display: flex;
        justify-content: space-between;
      }
      .separator {
        width: 50px;
        height: 5px;
        background-color: #3498db;
        margin: 20px 0;
      }
      .design-element {
        position: absolute;
        top: 0;
        left: 0;
        width: 120px;
        height: 120px;
        border-top: 3px solid #3498db;
        border-left: 3px solid #3498db;
        opacity: 0.7;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="blueprint-bg"></div>
      <div class="design-element"></div>
      <div class="content">
        <div class="logo">TruEstate</div>
        
        <div class="title-section">
          <div class="label">EXCLUSIVE</div>
          <div class="title">PROPERTY REPORT</div>
          <div class="separator"></div>
          <div class="subtitle">Investment Analysis</div>
        </div>
        
        <div class="project">{{PROJECT_NAME}}</div>
        <div class="date">Report Generated: {{UPDATED_DATE}}</div>
        
        <div class="footer">
          <div>CONFIDENTIAL INVESTMENT DOCUMENT</div>
          <div>TruEstate Research Team</div>
        </div>
      </div>
    </div>
  </body>
</html>
