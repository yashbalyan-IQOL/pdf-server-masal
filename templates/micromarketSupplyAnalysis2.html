<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Micromarket - Supply Analysis (2/2)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
    href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&family=Montserrat:wght@400;500;600;700&family=Lato:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <style>
      @page {
        size: 1920px 1080px;
        margin: 0;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Montserrat', sans-serif;
      }

      html, body {
        width: 1920px;
        height: 1080px;
        margin: 0;
        padding: 0;
        overflow: auto;
      }

      body {
        padding: 60px;
        background-color: #f5f5f5;
        background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M11 18c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm48 25c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm-43-7c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm63 31c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM34 90c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm56-76c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM12 86c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm28-65c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm23-11c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-6 60c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm29 22c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zM32 63c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm57-13c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-9-21c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM60 91c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM35 41c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM12 60c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2z' fill='%23bdbdbd' fill-opacity='0.1' fill-rule='evenodd'/%3E%3C/svg%3E");
        position: relative;
      }

      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 30px;
      }

      h1 {
        font-size: 72px;
        color: #000;
        font-family: 'Lora', serif;
        font-weight: bold;
      }

      h2 {
        font-size: 36px;
        color: #222;
        margin-bottom: 40px;
      }

      .cards-container {
        display: flex;
        justify-content: space-between;
        gap: 24px;
        width: 100%;
      }

      .card {
        background-color: #EDEDED;
        border-radius: 44px;
        width: 25%;
        border: 2px solid white;
        padding: 32px;
        padding-bottom: 40px;
        flex: 1;
        display: flex;
        flex-direction: column;
      }

      .card-title {
        font-size: 32px;
        font-weight: 700;
        text-align: center;
        padding-bottom: 33px;
        padding-left: 15px;
        padding-right: 15px;
        border-bottom: 2px solid #CFCFCF;
        margin-bottom: 20px;
      }

      .card-section {
        margin-bottom: 30px;
      }

      .section-title {
        font-size: 24px;
        font-weight: 600;
        text-align: center;
        margin-bottom: 10px;
      }

      .developer-list {
        font-size: 28px;
        line-height: 1.4;
        font-weight: 600;
        text-align: center;
        color: #444;
      }

      .units-section {
        display: flex;
        font-size: 24px;
        flex-direction: column;
        margin-bottom: 20px;
      }

      .units-title {
        font-size: 28px;
        font-weight: 500;
        margin-bottom: 5px;
        text-align: center;
        font-family: 'Lato', sans-serif;
      }

      .units-percentage {
        font-size: 28px;
        font-weight: 700;
        text-align: center;
      }

      .part-section {
        display: flex;
        flex-direction: column;
      }

      .part-title {
        font-size: 18px;
        font-weight: 500;
        margin-bottom: 5px;
        text-align: center;
      }

      .part-percentage {
        font-size: 28px;
        font-weight: 700;
        text-align: center;
      }

      .total-card {
        width: 25%;
        background-color: #DFF4F3;
        display: flex;
        border-radius: 44px;
        border: 2px solid white;
        
        padding-left: 32px;
        padding-right: 32px;
        margin-bottom: 0px;
        margin-top: 0px;
        flex-direction: column;
        justify-content: center;
      }

      .total-title {
        font-size: 28px;
        font-weight: 600;
        align-items: center;
        border-bottom: 2px solid #CFCFCF;
        text-align: center;
        margin-bottom: 30px;
        padding-bottom: 33px;
        font-family: 'Lato', sans-serif;  
      }

      .low-end-section {
        text-align: center;
        margin-bottom: 40px;
      }

      .low-end-title {
        font-size: 20px;
        font-weight: 500;
        margin-bottom: 5px;
      }

      .low-end-percentage {
        font-size: 28px;
        font-weight: 700;
      }

      .total-units-section {
        text-align: center;
      }

      .total-units-title {
        font-size: 20px;
        font-weight: 500;
        margin-bottom: 5px;
      }

      .total-units-percentage {
        font-size: 28px;
        font-weight: 700;
      }

      .estate-score {
        position: absolute;
        top: 80px;
        right: 80px;
        width: 120px;
        height: 120px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        color: white;
        z-index: 10;
      }
      .estate-score img{
        width: 120px;
        height: 120px;
        justify-content: center;
        align-items: center;
       
      }

      .estate-score::before {
        content: "";
        position: absolute;
        top: -8px;
        left: -8px;
        right: -8px;
        bottom: -8px;
        
        border-radius: 50%;
        z-index: -1;
      }

      .score-value {
        justify-content: center;
        align-items: center;
        position: absolute;
        font-size: 36px;
        font-weight: bold;
        line-height: 1;
      }
      .score-text {
        font-size: 14px;
        text-align: center;
        margin-top: 4px;
      }

      .score-label {
        position: absolute;
        width: 200%;
        top: -10px;
        left: -50%;
        text-align: center;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      .back-to-top {
        position: fixed;
        bottom: 30px;
        right: 30px;
        width: 60px;
        height: 60px;
        background-color: #0E766E;
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        cursor: pointer;
        z-index: 100;
      }

      .back-to-top svg {
        width: 30px;
        height: 30px;
        fill: white;
      }

      .orange-curve-top-right {
        position: absolute;
        top: 0;
        right: 0;
        width: 550px;
        height: 350px;
        background-color: #F0A830;
        opacity: 0.3;
        clip-path: polygon(100% 0, 30% 0, 100% 100%);
        z-index: -1;
      }

      .orange-curve-bottom-right {
        position: absolute;
        bottom: 0;
        right: 0;
        width: 600px;
        height: 500px;
        background-color: #F0A830;
        opacity: 0.3;
        clip-path: polygon(70% 0, 0 100%, 100% 100%, 100% 0);
        z-index: -1;
      }
    </style>
  </head>
  <body>
    <div class="orange-curve-top-right"></div>
    <div class="orange-curve-bottom-right"></div>

    <div class="header">
      <h1>Micromarket - Supply Analysis (2/2)</h1>
      <div class="estate-score">
     
        <div class="score-value">{{TRUEESTATE_SCORE}}<span style="font-size: 20px">/10</span></div>
        
        <img src="../assets/logos/impactScore.png" alt="impact logo" height="120px" width="120px">
      </div>

    </div>

    <h2>Builder Level</h2>

    <div class="cards-container">
      <div class="card">
        <div class="card-title">Luxury</div>
        
        <!-- <div class="card-section">
          <div class="section-title">Developer</div>
          <div class="developer-list">
            Prestige Group, Century, Brigade, Lodha, Century, Century, Century, Century etc
          </div>
        </div> -->
        
        <div class="units-section">
          <div class="units-title">Units</div>
          <div class="units-percentage">20.2%</div>
        </div>
        
        <div class="part-section">
          <div class="part-title">Part (%)</div>
          <div class="part-percentage">20.2%</div>
        </div>
      </div>

      <div class="card">
        <div class="card-title">Premium</div>
        
        <!-- <div class="card-section">
          <div class="section-title">Developer</div>
          <div class="developer-list">
            Prestige Group, Century, Brigade, Lodha, Century, Century, Century, Century etc
          </div>
        </div> -->
        
        <div class="units-section">
          <div class="units-title">Units</div>
          <div class="units-percentage">20.2%</div>
        </div>
        
        <div class="part-section">
          <div class="part-title">Part (%)</div>
          <div class="part-percentage">20.2%</div>
        </div>
      </div>

      <div class="card">
        <div class="card-title">Economy</div>
        
        <!-- <div class="card-section">
          <div class="section-title">Developer</div>
          <div class="developer-list">
            Prestige Group, Century, Brigade, Lodha, Century, Century, Century, Century etc
          </div>
        </div> -->
        
        <div class="units-section">
          <div class="units-title">Units</div>
          <div class="units-percentage">20.2%</div>
        </div>
        
        <div class="part-section">
          <div class="part-title">Part (%)</div>
          <div class="part-percentage">20.2%</div>
        </div>
      </div>

      <div class="total-card">
        <div class="total-title">Total</div>
        
        <div class="low-end-section">
          <div class="low-end-title">Low End</div>
          <div class="low-end-percentage">20.2%</div>
        </div>
        
        <div class="total-units-section">
          <div class="total-units-title">Units</div>
          <div class="total-units-percentage">20.2%</div>
        </div>
      </div>
    </div>

    <div class="back-to-top">
      <img src="../assets/logos/truestate.png" alt="back to top" height="100px" width="100px"/>
    </div>
  </body>
</html>
