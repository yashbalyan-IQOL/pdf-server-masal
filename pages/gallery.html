<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Property Gallery</title>
    <style>
      body {
        font-family: 'Arial', sans-serif;
        padding: 40px;
        color: #333;
        background-color: #f9f9f9;
      }
      h1 {
        color: #2c3e50;
        border-bottom: 2px solid #3498db;
        padding-bottom: 10px;
        font-size: 28px;
        text-transform: uppercase;
        text-align: center;
        margin-bottom: 30px;
      }
      .gallery-intro {
        text-align: center;
        margin-bottom: 30px;
        color: #7f8c8d;
      }
      .image-gallery {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 25px;
        margin: 0 auto;
      }
      .image-container {
        width: 100%;
        background-color: white;
        border-radius: 8px;
        overflow: hidden;
        box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        position: relative;
      }
      .image-container img {
        width: 100%;
        height: auto;
        display: block;
        transition: transform 0.3s ease;
      }
      .image-label {
        background-color: rgba(44, 62, 80, 0.8);
        color: white;
        padding: 8px 12px;
        font-size: 14px;
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
      }
      .no-images {
        text-align: center;
        color: #95a5a6;
        font-style: italic;
        padding: 50px 0;
        background-color: white;
        border-radius: 8px;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      }
      .footer {
        text-align: center;
        margin-top: 40px;
        color: #95a5a6;
        font-size: 12px;
        border-top: 1px solid #e0e0e0;
        padding-top: 20px;
      }
      .copyright {
        margin-top: 10px;
        font-size: 11px;
      }
    </style>
  </head>
  <body>
    <h1>prestige Gardenia Estate - Gallery</h1>
    
    <div class="gallery-intro">
      Visual showcase of this property development
    </div>
    
    <div class="image-gallery">
      <div class="image-container">
        <img src="https://storage.googleapis.com/masal-db-6cc78.appspot.com/photos/prestige%20Gardenia%20Estate/Prestige%281%29.png?GoogleAccessId&#x3D;campeign-data-stream-masal%40masal-db-6cc78.iam.gserviceaccount.com&amp;Expires&#x3D;1747661186&amp;Signature&#x3D;hEG6TJXNXZPDyIz6swWKaOcpeNuMDKNjwOIinXjA78ypwzaUc6vLMu6ttIkJSKv6dJErrdR5qZ3axz8847arbZuBTslo3EAMQstFwt0gEXihpx%2FmqupglB0rREAJY7JPr2KKJx8A5RYGw0X5au3tYR0r2wDl4BzLfM0BhdfPUegE0Hh0tA%2BgaPyPJF9XIJzblvaACrLiswX%2B9ssGWDPilaj3%2B5NHqxMHS6O%2BpAUzXxq5tij4h2NeFaATz0mUZx62SjVcqlWq%2Ba2Eu9PC0fIp1w5aF8W%2FfJXCJfCYOTbJTvxaDgIr%2BnGkor6BDjH1T6C0M2zNAO3GMlYn3KY4BvndVw%3D%3D" alt="Property view" />
        <div class="image-label">Property View 1</div>
      </div>
    </div>
    
    
    <div class="footer">
      Images shown are representative and may be subject to change as the project progresses.
      <div class="copyright">
        © 2025 TruEstate. All rights reserved.
      </div>
    </div>
  </body>
</html>
