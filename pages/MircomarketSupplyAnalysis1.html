<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Micromarket - Supply Analysis (1/2)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
    href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&family=Montserrat:wght@400;500;600;700&family=Lato:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <style>
      @page {
        size: 1920px 1080px;
        margin: 0;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Montserrat', sans-serif;
      }

      html, body {
        width: 1920px;
        height: 1080px;
        margin: 0;
        padding: 0;
        overflow: auto;
      }

      body {
        padding: 60px;
        background-color: #f5f5f5;
       background-image: url('../assets/bgImage.png');
        position: relative;
      }

      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 30px;
      }

      h1 {
        font-size: 72px;
        color: #000;
        font-family: 'Lora', serif;
        font-weight: bold;
      }

      h2 {
        font-size: 36px;
        color: #222;
        margin-bottom: 40px;
      }

      .cards-container {
        display: flex;
        justify-content: space-between;
        gap: 37px;
        width: 100%;
        
        
        /* height: 100%; */
      }

      .card {
        background-color: #EDEDED;
        border-radius: 44px;
        border: 2px solid white;
        padding: 32px;
        padding-bottom: 40px;
        flex: 1;
        display: flex;
        flex-direction: column;
      }

      .card-title {
        font-size: 32px;
        font-weight: 700;
        text-align: center;
        padding-bottom: 33px;
        padding-left: 15px;
        padding-right: 15px;
        border-bottom: 2px solid #CFCFCF;
        margin-bottom: 20px;
      }

      .card-content {
        display: flex;
        flex-direction: column;
        gap: 37px;
      }

      .card-item {
        display: flex;
        text-align: center;
        flex-direction: column;
        gap: 5px;
      }

      .bhk-label {
        font-size: 24px;
        color: black;
      }

      .percentage {
        font-size: 32px;
        font-weight: 700;
      }

      .total-card {
        background-color: #DFF4F3;
      }

      .estate-score {
        position: absolute;
        top: 60px;
        right: 60px;
        width: 120px;
        height: 120px;
        background-color: #0E766E;
        border-radius: 50%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        color: white;
        border: 3px solid white;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        z-index: 10;
      }

      .estate-score::before {
        content: "";
        position: absolute;
        top: -8px;
        left: -8px;
        right: -8px;
        bottom: -8px;
        border: 2px solid #0E766E;
        border-radius: 50%;
        z-index: -1;
      }

      .score-value {
        font-size: 36px;
        font-weight: bold;
        line-height: 1;
      }

      .score-text {
        font-size: 14px;
        text-align: center;
        margin-top: 4px;
      }

      .score-label {
        position: absolute;
        width: 200%;
        top: -10px;
        left: -50%;
        text-align: center;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      .back-to-top {
        position: fixed;
        bottom: 30px;
        right: 30px;
        width: 60px;
        height: 60px;
        
        display: flex;
        justify-content: center;
        align-items: center;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        cursor: pointer;
        z-index: 100;
      }

      .back-to-top svg {
        width: 30px;
        height: 30px;
        fill: white;
      }

      .decorative-star {
        position: absolute;
        top: 220px;
        right: 300px;
        width: 100px;
        height: 100px;
        color: #DD8107;
        font-size: 100px;
        transform: rotate(20deg);
      }

      .orange-curve-top-right {
        position: absolute;
        top: 0;
        right: 0;
        width: 350px;
        height: 350px;
        background-color: #F0A830;
        opacity: 0.3;
        clip-path: polygon(100% 0, 0 0, 100% 100%);
        z-index: -1;
      }

      .orange-curve-bottom-right {
        position: absolute;
        bottom: 0;
        right: 0;
        width: 400px;
        height: 400px;
        background-color: #F0A830;
        opacity: 0.3;
        clip-path: polygon(100% 0, 0 100%, 100% 100%);
        z-index: -1;
      }
    </style>
  </head>
  <body>
    <div class="orange-curve-top-right"></div>
    <div class="orange-curve-bottom-right"></div>
    <div class="decorative-star">★</div>

    <div class="header">
      <h1>Micromarket - Supply Analysis (1/2)</h1>
      <div class="estate-score">
        <!-- <div class="score-label">TruEstate Score</div>
        <div class="score-value">8<span style="font-size: 20px">/10</span></div>
        <div class="score-text">Impact<br>Score</div> -->
        <img src="../assets/icons/imactLogo.png" alt="impact logo" height="120px" width="120px"/>
      </div>
    </div>

    <h2>Configuration Level</h2>

    <div class="cards-container">
      <div class="card">
        <div class="card-title">Premium Tier</div>
        <div class="card-content">
          <div class="card-item">
            <div class="bhk-label">1 BHKs</div>
            <div class="percentage">0.0%</div>
          </div>
          <div class="card-item">
            <div class="bhk-label">2 BHKs</div>
            <div class="percentage">7.4%</div>
          </div>
          <div class="card-item">
            <div class="bhk-label">3 BHKs</div>
            <div class="percentage">12.3%</div>
          </div>
          <div class="card-item">
            <div class="bhk-label">4 BHKs</div>
            <div class="percentage">1.2%</div>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-title">Economy Tier</div>
        <div class="card-content">
          <div class="card-item">
            <div class="bhk-label">1 BHKs</div>
            <div class="percentage">0.0%</div>
          </div>
          <div class="card-item">
            <div class="bhk-label">2 BHKs</div>
            <div class="percentage">18.5%</div>
          </div>
          <div class="card-item">
            <div class="bhk-label">3 BHKs</div>
            <div class="percentage">58.0%</div>
          </div>
          <div class="card-item">
            <div class="bhk-label">4 BHKs</div>
            <div class="percentage">1.2%</div>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-title">Mass Tier</div>
        <div class="card-content">
          <div class="card-item">
            <div class="bhk-label">1 BHKs</div>
            <div class="percentage">0.0%</div>
          </div>
          <div class="card-item">
            <div class="bhk-label">2 BHKs</div>
            <div class="percentage">1.2%</div>
          </div>
          <div class="card-item">
            <div class="bhk-label">3 BHKs</div>
            <div class="percentage">0.0%</div>
          </div>
          <div class="card-item">
            <div class="bhk-label">4 BHKs</div>
            <div class="percentage">0.0%</div>
          </div>
        </div>
      </div>

      <div class="card total-card">
        <div class="card-title">Total</div>
        <div class="card-content">
          <div class="card-item">
            <div class="bhk-label">1 BHKs</div>
            <div class="percentage">0.0%</div>
          </div>
          <div class="card-item">
            <div class="bhk-label">2 BHKs</div>
            <div class="percentage">27.2%</div>
          </div>
          <div class="card-item">
            <div class="bhk-label">3 BHKs</div>
            <div class="percentage">70.4%</div>
          </div>
          <div class="card-item">
            <div class="bhk-label">4 BHKs</div>
            <div class="percentage">2.5%</div>
          </div>
        </div>
      </div>
    </div>

    <div class="back-to-top">
      <img src="../assets/logos/truestate.png" alt="back to top" height="100px" width="100px"/>
    </div>
  </body>
</html>
